<div class="container">
    <app-ccmsheader></app-ccmsheader>
    
    <div class="content">
        <div class="page">
            <div class="card">

                <div class="card-header">
                    <div class="logo-icon">
                        <i class="material-icons">account_balance</i>
                    </div>
                    <h2>Chhattisgarh CCMS Portal</h2>
                    <p>Sign in to your account</p>
                </div>

                <form (ngSubmit)="onSubmit()">
                    <div class="field">
                        <label>Email</label>
                        <div class="input-wrap">
                            <i class="material-icons">person</i>
                            <input type="email" name="email" placeholder="Enter your user Email" [(ngModel)]="email" />
                        </div>
                    </div>

                    <div class="field">
                        <label>Password</label>
                        <div class="input-wrap">
                            <i class="material-icons">lock</i>
                            <input type="password" name="password" placeholder="Enter your password"
                                [(ngModel)]="password" />

                        </div>
                        <!-- <div class="forgot"><a routerLink="/forgot-password">Forgot password?</a></div> -->
                    </div>

                    <button type="submit" class="btn-login">
                        <i class="material-icons">login</i> Sign in
                    </button>

                </form>

                <div class="footer-note">
                    Designed, Developed & Hosted by<br>
                    <strong>National Informatics Centre (NIC)</strong> · Mahanadi Bhawan, New Raipur
                </div>

            </div>
        </div>
    </div>
    <app-ccmsfooter></app-ccmsfooter>
</div>
